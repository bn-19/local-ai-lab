<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">Local Lab starter screen concept</title>
  <desc id="desc">A light local AI task workspace with a task description, candy and data analytics recipe choices, file selector and a proposed setup sidebar. Illustrative design only, no model results.</desc>
  <defs>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#263b33}.muted{fill:#69776c}.green{fill:#30694e}.tiny{font-size:11px;letter-spacing:1.8px;font-weight:600}.small{font-size:13px}.body{font-size:15px}.label{font-size:14px;font-weight:600}.title{font-size:36px;font-weight:600;letter-spacing:-1.3px}</style>
    <g id="candy"><path d="M-12 0 L2 6 L2 20 L-12 26 L-8 13Z"/><rect width="49" height="26" rx="6"/><path d="M61 0 L47 6 L47 20 L61 26 L57 13Z"/><path d="M15 5h18M15 10h18M15 15h18M15 20h18" stroke="#f8f9f3" opacity=".55" stroke-width="1.3"/></g>
  </defs>
  <rect width="1440" height="1040" fill="#f5f5ef"/>
  <rect width="214" height="1040" fill="#edefe6"/>
  <path d="M214 0V1040M214 76H1440" stroke="#d9dfd1"/>
  <rect x="27" y="31" width="34" height="34" rx="9" fill="#30694e"/><path d="M39 40v16h7M50 56V40h-6" fill="none" stroke="#f8f9f3" stroke-width="2.6"/>
  <text x="72" y="55" font-size="22" font-weight="650" letter-spacing="-.7">Local Lab</text>
  <text x="37" y="135" class="tiny muted">YOUR WORKSPACE</text>
  <rect x="24" y="154" width="166" height="42" rx="7" fill="#dfeadc"/>
  <text x="39" y="181" font-size="20" class="green">＋</text><text x="69" y="180" class="label green">New task</text>
  <text x="40" y="228" font-size="19" class="muted">▤</text><text x="69" y="227" class="small muted">Setup plan</text>
  <text x="40" y="274" font-size="19" class="muted">⌘</text><text x="69" y="273" class="small muted">Your computer</text>
  <circle cx="34" cy="969" r="3.5" fill="#30694e"/><text x="46" y="973" font-size="11" font-weight="600">Designed for local use</text><text x="46" y="991" font-size="10" class="muted">Preview uses no cloud processing</text>
  <text x="263" y="45" class="small">Workspace</text><text x="344" y="45" class="small muted">/ New task</text>
  <rect x="1252" y="23" width="133" height="28" rx="14" fill="#f8efd9" stroke="#dbcda9"/><text x="1270" y="42" font-size="12" fill="#766035">Design preview</text>
  <text x="268" y="133" class="tiny green">AI THAT FITS YOUR EVERYDAY</text>
  <text x="266" y="184" class="title">What would you like help with?</text>
  <text x="268" y="216" class="body muted">Start with the task. We’ll help find, check and tune a local model for it.</text>
  <text x="268" y="271" class="label">Describe the result you want</text>
  <rect x="267" y="286" width="684" height="119" rx="11" fill="#fafbf5" stroke="#d5dcd0"/>
  <text x="288" y="319" class="body">Recognize the candy in a photo and tell me which</text><text x="288" y="346" class="body">types are there.</text>
  <text x="268" y="445" class="label">Start with a demo recipe</text><text x="787" y="445" font-size="11" class="muted">2 supported directions</text>
  <rect x="267" y="461" width="684" height="168" rx="10" fill="#fafbf5" stroke="#d5dcd0"/>
  <path d="M278 461h662q11 0 11 11v72H267v-72q0-11 11-11" fill="#e1ebdd"/>
  <path d="M267 544H951" stroke="#d5dcd0"/>
  <text x="289" y="511" font-size="28" class="green">◈</text><text x="335" y="496" class="label">Recognize candy</text><text x="335" y="521" class="small muted">Photos → candy types or visible-item counts</text><text x="913" y="509" font-size="22" class="green">↗</text>
  <text x="291" y="591" font-size="28" class="green">▥</text><text x="335" y="579" class="label">Understand a dataset</text><text x="335" y="604" class="small muted">A spreadsheet → useful calculations and charts</text><text x="913" y="592" font-size="22" class="green">↗</text>
  <text x="268" y="672" class="label">Choose sample images</text><text x="789" y="672" font-size="11" class="muted">Optional for this preview</text>
  <rect x="267" y="688" width="684" height="166" rx="10" fill="#f4f8ef" stroke="#aabda8" stroke-dasharray="5 5"/>
  <rect x="593" y="704" width="32" height="32" rx="7" fill="#fafbf5" stroke="#d5dcd0"/><text x="602" y="729" font-size="23">↑</text>
  <text x="451" y="760" class="label">A few examples make the task clearer</text><text x="432" y="784" class="small muted">For training, we’ll also need the correct candy labels.</text>
  <rect x="538" y="799" width="141" height="29" rx="6" fill="#fafbf5" stroke="#d5dcd0"/><text x="562" y="819" font-size="12">Choose images</text>
  <text x="416" y="845" font-size="10" class="muted">Preview reads filenames only. Nothing is uploaded or analyzed.</text>
  <text x="268" y="878" font-size="11" class="muted">No files selected.</text>
  <rect x="267" y="899" width="176" height="43" rx="7" fill="#30694e"/><text x="288" y="926" font-size="13" font-weight="600" style="fill:#f8f9f3">Preview setup</text><text x="414" y="927" font-size="18" style="fill:#f8f9f3">→</text>
  <text x="464" y="918" font-size="11" class="muted">Review the plan before</text><text x="464" y="935" font-size="11" class="muted">any model downloads.</text>
  <rect x="984" y="258" width="401" height="664" rx="13" fill="#eaf0e4" stroke="#d3dfcc"/>
  <circle cx="1015" cy="291" r="3.5" fill="#30694e"/><text x="1028" y="295" font-size="10" font-weight="650" letter-spacing="1.2" class="green">A SETUP YOU CAN UNDERSTAND</text>
  <text x="1012" y="341" font-size="29" font-weight="550" letter-spacing="-.8">A small model.</text><text x="1012" y="376" font-size="29" font-weight="550" letter-spacing="-.8">A useful result.</text>
  <text x="1012" y="408" class="small muted">Start with a pretrained vision model.</text><text x="1012" y="429" class="small muted">Teach it the candy types you care</text><text x="1012" y="450" class="small muted">about using labeled examples.</text>
  <circle cx="1024" cy="487" r="12" fill="none" stroke="#adbea6"/><text x="1021" y="491" font-size="11" class="green">1</text><text x="1048" y="486" class="label">Understand the task</text><text x="1048" y="507" font-size="12" class="muted">Identify types, or locate and count.</text>
  <circle cx="1024" cy="548" r="12" fill="none" stroke="#adbea6"/><text x="1021" y="552" font-size="11" class="green">2</text><text x="1048" y="547" class="label">Find a fitting setup</text><text x="1048" y="568" font-size="12" class="muted">A small classifier or object detector.</text>
  <circle cx="1024" cy="609" r="12" fill="none" stroke="#adbea6"/><text x="1021" y="613" font-size="11" class="green">3</text><text x="1048" y="608" class="label">Check, then improve</text><text x="1048" y="629" font-size="12" class="muted">Keep a change only if it helps.</text>
  <path d="M1012 655H1357" stroke="#c4d4bd"/><text x="1012" y="681" class="tiny muted">EXAMPLE OUTPUT</text>
  <use href="#candy" x="1045" y="710" fill="#cb915b" transform="rotate(-15 1070 723)"/><use href="#candy" x="1156" y="702" fill="#8fa66e" transform="rotate(13 1180 715)"/><use href="#candy" x="1255" y="730" fill="#c7a658" transform="rotate(-12 1280 743)"/>
  <use href="#candy" x="1104" y="759" fill="#a391b3" transform="rotate(14 1128 772)"/><use href="#candy" x="1213" y="777" fill="#ba7d69" transform="rotate(-7 1237 790)"/>
  <text x="1012" y="829" font-size="12">Candy labels and supported counts.</text><text x="1012" y="851" font-size="10" class="muted">Illustration, not a model result</text><path d="M1012 873H1357" stroke="#c4d4bd"/><text x="1012" y="897" font-size="10" class="muted">Two demo recipes today. More tasks through new recipes.</text>
  <path d="M267 974H1385" stroke="#d5dcd0"/><text x="268" y="1003" font-size="12" font-weight="600">Your files, with a clear boundary.</text><text x="478" y="1003" font-size="11" class="muted">This prototype has no upload endpoint. Local processing needs verification in the real app.</text>
</svg>
